<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"
     viewBox="0 0 1600 900" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<defs>
  <marker id="ar" markerWidth="11" markerHeight="8" refX="10" refY="4"
          orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L11,4 L0,8 Z" fill="context-stroke"/>
  </marker>
  <marker id="arInk" markerWidth="11" markerHeight="8" refX="10" refY="4"
          orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L11,4 L0,8 Z" fill="#03234B"/>
  </marker>
  <marker id="arRed" markerWidth="11" markerHeight="8" refX="10" refY="4"
          orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L11,4 L0,8 Z" fill="#D0323C"/>
  </marker>
  <marker id="arGreen" markerWidth="11" markerHeight="8" refX="10" refY="4"
          orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L11,4 L0,8 Z" fill="#12A05C"/>
  </marker>
  <marker id="arCyan" markerWidth="11" markerHeight="8" refX="10" refY="4"
          orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L11,4 L0,8 Z" fill="#1B7CA8"/>
  </marker>
  <pattern id="hatch" width="9" height="9" patternTransform="rotate(45)"
           patternUnits="userSpaceOnUse">
    <rect width="9" height="9" fill="#FDF1DE"/>
    <line x1="0" y1="0" x2="0" y2="9" stroke="#E08A1E" stroke-width="3.5" opacity="0.55"/>
  </pattern>
  <pattern id="hatchGray" width="9" height="9" patternTransform="rotate(45)"
           patternUnits="userSpaceOnUse">
    <rect width="9" height="9" fill="#EFF3F7"/>
    <line x1="0" y1="0" x2="0" y2="9" stroke="#C6D0DB" stroke-width="3.5"/>
  </pattern>
</defs>
<text x="64" y="74" font-size="38" fill="#03234B" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, Helvetica, sans-serif">Secure boot: two stages, one door that only opens forwards</text>
<text x="64" y="110" font-size="21" fill="#5B6B80" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, Helvetica, sans-serif">OEMiRoT verifies the application on every reset — then hides itself before handing over</text>
<circle cx="110" cy="296" r="44" fill="#03234B"/>
<text x="110" y="303.5" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-family="Segoe UI, Arial, Helvetica, sans-serif"></text>
<text x="110" y="288" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-family="Segoe UI, Arial, Helvetica, sans-serif">RESET</text>
<text x="110" y="310" font-size="13" fill="#3CB4E6" text-anchor="middle" font-weight="600" font-family="Segoe UI, Arial, Helvetica, sans-serif">BOOTADD</text>
<line x1="158" y1="296" x2="218" y2="296" stroke="#03234B" stroke-width="3" stroke-linecap="round" marker-end="url(#arInk)"/>
<rect x="228" y="200" width="700" height="300" rx="16" fill="#FFFFFF" stroke="#03234B" stroke-width="3"/>
<rect x="228" y="200" width="700" height="58" rx="16" fill="#03234B"/>
<rect x="228" y="240" width="700" height="18" rx="0" fill="#03234B"/>
<text x="578" y="238" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-family="Segoe UI, Arial, Helvetica, sans-serif">OEMiRoT   —   immutable root of trust</text>
<circle cx="268" cy="298" r="17" fill="#1B7CA8"/>
<text x="268" y="305.5" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-family="Segoe UI, Arial, Helvetica, sans-serif">1</text>
<text x="298" y="293" font-size="20" fill="#03234B" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, Helvetica, sans-serif">Apply protections</text>
<text x="298" y="315" font-size="16" fill="#5B6B80" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, Helvetica, sans-serif">MPU · tamper · ECC · caches</text>
<circle cx="268" cy="353" r="17" fill="#1B7CA8"/>
<text x="268" y="360.5" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-family="Segoe UI, Arial, Helvetica, sans-serif">2</text>
<text x="298" y="348" font-size="20" fill="#03234B" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, Helvetica, sans-serif">Check option bytes</text>
<text x="298" y="370" font-size="16" fill="#5B6B80" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, Helvetica, sans-serif">BOOTADD · BOOT_LOCK · WRP · HDP · RDP</text>
<circle cx="268" cy="408" r="17" fill="#1B7CA8"/>
<text x="268" y="415.5" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-family="Segoe UI, Arial, Helvetica, sans-serif">3</text>
<text x="298" y="403" font-size="20" fill="#03234B" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, Helvetica, sans-serif">Verify the application</text>
<text x="298" y="425" font-size="16" fill="#5B6B80" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, Helvetica, sans-serif">SHA-256 + ECDSA P-256, twice (fault-injection hardened)</text>
<circle cx="268" cy="463" r="17" fill="#1B7CA8"/>
<text x="268" y="470.5" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-family="Segoe UI, Arial, Helvetica, sans-serif">4</text>
<text x="298" y="458" font-size="20" fill="#03234B" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, Helvetica, sans-serif">Close the door</text>
<text x="298" y="480" font-size="16" fill="#5B6B80" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, Helvetica, sans-serif">shrink MPU · close HDP · disable crypto clocks</text>
<line x1="938" y1="350" x2="1008" y2="350" stroke="#12A05C" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arGreen)"/>
<text x="973" y="332" font-size="16" fill="#12A05C" text-anchor="middle" font-weight="700" font-family="Segoe UI, Arial, Helvetica, sans-serif">verified</text>
<text x="973" y="382" font-size="16" fill="#12A05C" text-anchor="middle" font-weight="700" font-family="Segoe UI, Arial, Helvetica, sans-serif">jump</text>
<rect x="1018" y="260" width="300" height="180" rx="16" fill="#E2F5EC" stroke="#12A05C" stroke-width="3"/>
<text x="1168" y="312" font-size="25" fill="#03234B" text-anchor="middle" font-weight="700" font-family="Segoe UI, Arial, Helvetica, sans-serif">APPLICATION</text>
<text x="1168" y="346" font-size="19" fill="#12A05C" text-anchor="middle" font-weight="700" font-family="Consolas, Menlo, monospace">0x08018400</text>
<text x="1168" y="382" font-size="17" fill="#5B6B80" text-anchor="middle" font-weight="400" font-family="Segoe UI, Arial, Helvetica, sans-serif">updatable firmware</text>
<text x="1168" y="408" font-size="17" fill="#5B6B80" text-anchor="middle" font-weight="400" font-family="Segoe UI, Arial, Helvetica, sans-serif">carries the update agent</text>
<rect x="228" y="566" width="1090" height="78" rx="14" fill="#ECE9FB" stroke="#6B5BD2" stroke-width="2"/>
<text x="258" y="601" font-size="19" fill="#03234B" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, Helvetica, sans-serif">After the jump the RoT code and the keys are GONE from the map (HDP).</text>
<text x="258" y="629" font-size="17" fill="#5B6B80" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, Helvetica, sans-serif">The application cannot read them, cannot call back, and cannot modify the boot stage. Only a reset returns to the RoT.</text>
<rect x="228" y="686" width="380.59999999999997" height="36" rx="18.0" fill="#EFF3F7" stroke="#03234B" stroke-width="1.6"/>
<text x="418.29999999999995" y="710.12" font-size="17" fill="#03234B" text-anchor="middle" font-weight="600" font-family="Segoe UI, Arial, Helvetica, sans-serif">Immutable — write-protected (WRP)</text>
<rect x="624.5999999999999" y="686" width="278.6" height="36" rx="18.0" fill="#ECE9FB" stroke="#6B5BD2" stroke-width="1.6"/>
<text x="763.8999999999999" y="710.12" font-size="17" fill="#03234B" text-anchor="middle" font-weight="600" font-family="Segoe UI, Arial, Helvetica, sans-serif">Hidden after boot (HDP)</text>
<rect x="919.1999999999999" y="686" width="309.2" height="36" rx="18.0" fill="#E2F5EC" stroke="#12A05C" stroke-width="1.6"/>
<text x="1073.8" y="710.12" font-size="17" fill="#03234B" text-anchor="middle" font-weight="600" font-family="Segoe UI, Arial, Helvetica, sans-serif">Re-verified on every reset</text>
<text x="64" y="812" font-size="19" fill="#D0323C" text-anchor="start" font-weight="600" font-family="Segoe UI, Arial, Helvetica, sans-serif">Any failed check ends at Error_Handler — the application simply never runs.</text>
</svg>
